<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 489 225" role="img" aria-labelledby="title desc">
  <title id="title">אהלא וסהלא</title>
  <desc id="desc">לוגו בית הספר ללימוד השפה הערבית</desc>

  <style>
    * { transform-box: view-box; }
    #emblem {
      transform-origin: 402px 111px;
      animation: emblem-in 1s cubic-bezier(.18,.9,.28,1.18) both;
    }
    #calligraphy {
      transform-origin: 315px 90px;
      animation: calligraphy-in .9s cubic-bezier(.2,.75,.25,1) .35s both;
    }
    #school-name {
      transform-origin: 157px 176px;
      animation: school-in .65s cubic-bezier(.2,.8,.25,1) 1s both;
    }
    .accent {
      fill: none;
      stroke: #5c7f3a;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: .75;
      animation: accent-in .7s ease-out 1.15s both;
    }
    @keyframes emblem-in {
      from { opacity: 0; transform: scale(.72) rotate(-18deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes calligraphy-in {
      from { opacity: 0; transform: translateX(34px); filter: blur(4px); }
      to { opacity: 1; transform: translateX(0); filter: blur(0); }
    }
    @keyframes school-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes accent-in {
      0% { stroke-dashoffset: 1; }
      55%, 80% { stroke-dashoffset: 0; opacity: .75; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #emblem, #calligraphy, #school-name, .accent { animation: none; }
      .accent { display: none; }
    }
  </style>

  <defs>
    <clipPath id="calligraphy-clip">
      <rect x="0" y="0" width="320" height="160"/>
    </clipPath>
    <clipPath id="school-clip">
      <rect x="0" y="160" width="320" height="31"/>
    </clipPath>
    <clipPath id="emblem-clip">
      <path d="M320 0h169v225H315V100h5z"/>
    </clipPath>
  </defs>

  <!-- Each visible part is deliberately independent so its timing can be tuned. -->
  <g id="emblem" aria-label="סמל">
    <image href="logo-intro.svg" x="0" y="0" width="489" height="225"
      clip-path="url(#emblem-clip)"/>
  </g>

  <g id="calligraphy" aria-label="כיתוב קליגרפי">
    <image href="logo-intro.svg" x="0" y="0" width="489" height="225"
      clip-path="url(#calligraphy-clip)"/>
  </g>

  <path class="accent" pathLength="1" d="M288 165H27"/>

  <g id="school-name" aria-label="בית הספר ללימוד השפה הערבית">
    <image href="logo-intro.svg" x="0" y="0" width="489" height="225"
      clip-path="url(#school-clip)"/>
  </g>
</svg>
