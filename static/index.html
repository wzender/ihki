<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>احكي · אחכי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Sans+Mono&display=swap">
<style>
/* Layout: one compact practice card that fits the first screen: prompt, mic, hint, per-word feedback, actions. RTL. */
:root{
  --bg:#EEF0E8; --surface:#FAFBF6; --ink:#1C241D; --muted:#5E685C; --line:#D5DACB;
  --olive:#4B6A2C; --on-olive:#FFFFFF; --olive-soft:#E3EAD6;
  --sumac:#A3303F; --sumac-bg:#F6E3E3; --ok:#2F7A4A; --ok-bg:#E1F0E4; --amber:#8A5E0E; --amber-bg:#F5ECD8;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Arabic Typesetting","Traditional Arabic",serif;
  --f-ipa:"Noto Sans Mono","DejaVu Sans Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141915; --surface:#1D241F; --ink:#E7EBE2; --muted:#9AA595; --line:#2F3830;
  --olive:#93B85F; --on-olive:#10150F; --olive-soft:#26301F;
  --sumac:#E77B87; --sumac-bg:#3A1E23; --ok:#6CC08A; --ok-bg:#1C3324; --amber:#E0B45A; --amber-bg:#3A2F17;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);padding:10px 16px 24px;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.brand{font:400 24px/1 var(--f-display)}
.brand .ar{font-family:var(--f-ar);font-weight:700;color:var(--olive);margin-inline-start:8px}
.sub{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.prompt{font:400 clamp(22px,5vw,30px)/1.2 var(--f-display);text-wrap:balance;margin:0}
.task{color:var(--muted);font-size:14px;margin:-6px 0 0}
.hint{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;padding:6px 12px;border-radius:10px;background:var(--olive-soft)}
.hint .tr{font-size:22px;font-weight:700}
.hint .arline{font:500 16px/1.4 var(--f-ar);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 15px var(--f-body);border-radius:10px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn.primary{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
.mic-zone{display:flex;align-items:center;gap:14px}
.mic{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:var(--olive);color:var(--on-olive);cursor:pointer;display:grid;place-items:center;position:relative}
.mic svg{width:26px;height:26px}
.mic.live{background:var(--sumac)}
.mic.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--sumac);opacity:.5;animation:pulse 1.2s ease-out infinite}
.mic:disabled{opacity:.5;cursor:progress}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.live::after{animation:none}}
.status{color:var(--muted);font-size:14px}
.result{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.verdict{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.score{font:400 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pill{font:700 13px var(--f-body);padding:4px 10px;border-radius:999px}
.good{background:var(--ok-bg);color:var(--ok)} .mid{background:var(--amber-bg);color:var(--amber)} .bad{background:var(--sumac-bg);color:var(--sumac)}
.words{display:flex;flex-wrap:wrap;gap:6px 14px;direction:rtl;align-items:flex-start}
.word{display:flex;flex-direction:column;align-items:center}
.word .w{font:700 24px/1.4 var(--f-body)}
.word .h{font-size:17px;line-height:1.4;color:var(--muted);min-height:1.4em}
.word.legend{align-items:flex-start;color:var(--muted);font-size:12px;font-weight:700}
.word.legend .w,.word.legend .h{font:inherit;line-height:33.6px;color:inherit;min-height:0}
.word.legend .h{line-height:23.8px}
.word .n{font-size:12px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.word .n [lang=ar]{font-family:var(--f-ar);font-size:14px}
.word .w.bad{background:none;color:var(--sumac)} .word .w.mid{background:none;color:var(--amber)} .word .w.good{background:none;color:var(--ink)}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tips li{padding:6px 10px;border-radius:10px;border:1px solid var(--line);font-size:15px;line-height:1.4}
.tips .what::after{content:" · "}
.tips .what{font-weight:700}
.tips .what .ar{font-family:var(--f-ar);font-size:14px;font-weight:400;color:var(--muted)}
.version{position:fixed;bottom:4px;left:6px;z-index:9;font:500 11px/1 var(--f-ipa);direction:ltr;padding:3px 6px;border-radius:6px;background:var(--amber-bg);color:var(--amber);opacity:.85;pointer-events:none}
.voicebox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.voicebox select{font:600 14px var(--f-body);padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.note{font-size:12px;margin:0;color:var(--muted);max-width:65ch}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">אחכי<span class="ar">احكي</span></div>
    <div class="sub">תרגמו לערבית מדוברת ואמרו בקול</div>
  </header>

  <div class="chips" id="cats" role="group" aria-label="נושא"></div>
  <div id="envWarn" class="warn" hidden></div>

  <main class="card" aria-live="polite">
    <div class="meta"><span id="catName"></span><span id="counter"></span></div>
    <h1 class="prompt" id="prompt">טוען…</h1>
    <p class="task">איך אומרים את זה בערבית פלסטינית?</p>

    <div class="mic-zone">
      <button class="mic" id="mic" aria-label="הקליטו את התשובה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
      </button>
      <div class="status" id="status">לחצו, דברו, ולחצו שוב לסיום</div>
    </div>

    <div class="hint" id="hint" hidden>
      <div class="tr" id="hintTr"></div>
      <div class="arline" id="hintAr" lang="ar" hidden></div>
    </div>

    <section class="result" id="result" hidden>
      <div class="verdict"><span class="score" id="score"></span><span class="pill" id="pill"></span><div class="words" id="words"></div></div>
      <ul class="tips" id="tips"></ul>
    </section>

    <div class="row">
      <button class="btn" id="hintBtn">רמז</button>
      <button class="btn" id="answerBtn">הצג תשובה</button>
      <button class="btn" id="speakBtn">🔊 השמע</button>
      <button class="btn" id="playMine" disabled>▶ ההקלטה שלי</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="nextBtn">המשפט הבא ←</button>
    </div>
  </main>

  <label class="voicebox">קול ההשמעה<select id="voiceId"></select></label>
  <p class="note">הניתוח נעשה ברמת ההגה. ההשמעה נוצרת בקול ערבי פלסטיני של Sawtak Arabi; אם השירות אינו זמין, נעשה שימוש בקול הערבי של המכשיר.</p>
</div>
<div class="version" title="גרסת debug">v __VERSION__<span id="ttsInfo"></span></div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let CATS=[], PHRASES=[], cat=store.get("ihki.cat","meet"), best=store.get("ihki.best2",{}), order=[], pos=0, cur=null;
let myAudioUrl=null;

const band=s=>s>=75?"good":s>=50?"mid":"bad";

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function buildCats(){
  const box=$("cats"); box.innerHTML="";
  for(const c of CATS){
    const b=document.createElement("button"); b.className="chip"; b.textContent=c.name;
    b.setAttribute("aria-pressed", c.id===cat);
    b.onclick=()=>{cat=c.id; store.set("ihki.cat",cat); buildCats(); startCat();};
    box.appendChild(b);
  }
}
function startCat(){ order=shuffle(PHRASES.filter(p=>p.cat===cat).map(p=>p.id)); pos=0; show(); }
function show(){
  cur=PHRASES[order[pos]];
  $("prompt").textContent=cur.he;
  $("catName").textContent=CATS.find(c=>c.id===cat).name;
  const b=best[cur.id];
  $("counter").textContent=`${pos+1} / ${order.length}`+(b!=null?` · שיא: ${b}`:"");
  $("hint").hidden=true; $("hintAr").hidden=true; $("result").hidden=true;
  $("status").textContent="לחצו, דברו, ולחצו שוב לסיום";
  $("playMine").disabled=true;
}

function render(r){
  if(r.error){ $("status").textContent=r.message; return; }
  $("status").textContent="לחצו כדי לנסות שוב";
  $("score").textContent=r.score;
  const pill=$("pill"); const s=r.score;
  pill.className="pill "+(s>=85?"good":s>=60?"mid":"bad");
  pill.textContent= r.unrelated ? "משפט אחר?" : s>=85?"מצוין": s>=60?"כמעט":"נסו שוב";

  const words=$("words"); words.innerHTML="";
  const legend=document.createElement("div"); legend.className="word legend";
  legend.innerHTML='<div class="w">הנכון</div><div class="h">נשמע</div>'; words.appendChild(legend);
  for(const w of r.words){
    const box=document.createElement("div"); box.className="word";
    const ar=document.createElement("div"); ar.className="w "+band(w.score); ar.textContent=w.tr;
    const hd=document.createElement("div"); hd.className="h"; hd.textContent=w.heard_tr||"–";
    const n=document.createElement("div"); n.className="n"; n.textContent=Math.round(w.score)+" · ";
    const a=document.createElement("span"); a.lang="ar"; a.textContent=w.ar; n.append(a);
    box.append(ar,hd,n); words.appendChild(box);
  }

  const tips=$("tips"); tips.innerHTML="";
  if(r.unrelated){
    const li=document.createElement("li");
    li.innerHTML='<span class="what">ההקלטה לא דומה למשפט הצפוי</span><span>ייתכן שבחרתם ניסוח אחר. לחצו "הצג תשובה" ונסו את הנוסח המוצע.</span>';
    tips.appendChild(li);
  }
  for(const t of r.tips){
    const li=document.createElement("li");
    const what=document.createElement("span"); what.className="what";
    what.append(t.title+" במילה "+(t.word_tr||"")+" ");
    const w=document.createElement("span"); w.className="ar"; w.lang="ar"; w.textContent=t.word; what.append(w);
    const body=document.createElement("span"); body.textContent=t.text;
    li.append(what,body); tips.appendChild(li);
  }
  if(r.issues.length){
    const li=document.createElement("li");
    const what=document.createElement("span"); what.className="what"; what.textContent=r.tips.length?"עוד הגאים לא מדויקים":"מה לא היה מדויק";
    const body=document.createElement("span");
    body.textContent=r.issues.map(i=>`${i.sound} ב״${i.word_tr}״ (${i.score})`+(i.missing?" – לא נשמעה":i.heard?` – נשמע כמו ${i.heard}`:"")).join(" · ");
    li.append(what,body); tips.appendChild(li);
  }
  if(!r.unrelated && !r.tips.length && !r.issues.length){
    const li=document.createElement("li"); li.innerHTML='<span class="what">כל העיצורים נשמעו נכון</span><span>נסו לומר את המשפט בקצב דיבור טבעי.</span>';
    tips.appendChild(li);
  }
  $("result").hidden=false;
  $("result").scrollIntoView({block:"nearest",behavior:"smooth"});
  if(best[cur.id]==null||s>best[cur.id]){best[cur.id]=s; store.set("ihki.best2",best);}
}

/* ---------- recording ---------- */
let rec=null, chunks=[], stopTimer=null;
const mic=$("mic");
function pickType(){ for(const t of ["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4","audio/webm"]) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t)) return t; return ""; }

if(!navigator.mediaDevices||!window.MediaRecorder){
  const w=$("envWarn"); w.textContent="הדפדפן הזה לא תומך בהקלטה. השתמשו ב־Chrome, Edge, Firefox או Safari עדכניים, בכתובת https."; w.hidden=false; mic.disabled=true;
}

mic.onclick=async()=>{
  if(rec&&rec.state==="recording"){ rec.stop(); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch{ $("status").textContent="אין גישה למיקרופון. אשרו גישה בהגדרות הדפדפן."; return; }
  const type=pickType();
  rec=new MediaRecorder(stream, type?{mimeType:type}:{}); chunks=[];
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstart=()=>{ mic.classList.add("live"); $("status").textContent="מקליט… לחצו שוב לסיום"; $("result").hidden=true; stopTimer=setTimeout(()=>rec.state==="recording"&&rec.stop(),10000); };
  rec.onstop=async()=>{
    clearTimeout(stopTimer); mic.classList.remove("live"); stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
    if(myAudioUrl) URL.revokeObjectURL(myAudioUrl);
    myAudioUrl=URL.createObjectURL(blob); $("playMine").disabled=false;
    mic.disabled=true; $("status").textContent="מנתח…";
    try{
      const fd=new FormData(); fd.append("phrase_id",cur.id); fd.append("audio",blob,"rec");
      const res=await fetch("/api/score",{method:"POST",body:fd});
      if(!res.ok) throw new Error(res.status);
      render(await res.json());
    }catch(err){ $("status").textContent="הניתוח נכשל ("+err.message+"). נסו שוב."; }
    finally{ mic.disabled=false; }
  };
  rec.start();
};
$("playMine").onclick=()=>{ if(myAudioUrl) new Audio(myAudioUrl).play(); };

/* ---------- hint, answer, TTS ---------- */
$("hintBtn").onclick=()=>{ $("hintTr").textContent=cur.tr; $("hint").hidden=false; };
$("answerBtn").onclick=()=>{ $("hintTr").textContent=cur.tr; $("hintAr").textContent=cur.ar; $("hint").hidden=false; $("hintAr").hidden=false; };
$("nextBtn").onclick=()=>{ pos=(pos+1)%order.length; if(pos===0) shuffle(order); show(); };
function arVoice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>/^ar[-_](PS|JO|LB|SY|IL)/i.test(v.lang))||vs.find(v=>/^ar/i.test(v.lang)); }
if("speechSynthesis" in window) speechSynthesis.getVoices();
const ttsUrls={};   // "phrase id|voice" -> {url, voice label} of the server-generated answer
$("voiceId").onchange=()=>store.set("ihki.voice",$("voiceId").value);   // Sawtak voice of the playback; options come from the server
let ttsVoice="";   // debug: why the server voice was not used, shown in the version badge
const ttsInfo=t=>{ $("ttsInfo").textContent=" · 🔊 "+t; };
let ttsOff=false;   // server has no TTS key: stop asking
$("speakBtn").onclick=async()=>{
  const id=cur.id, btn=$("speakBtn"), voice=$("voiceId").value, key=id+"|"+voice;
  ttsVoice="";
  if(!ttsOff && !ttsUrls[key]){
    btn.disabled=true;
    try{
      const res=await fetch("/api/tts/"+id+(voice?"?voice="+encodeURIComponent(voice):""));
      if(res.ok){
        const h=k=>decodeURIComponent(res.headers.get(k)||""), name=h("X-TTS-Voice-Name");
        ttsUrls[key]={url:URL.createObjectURL(await res.blob()),
          label:(h("X-TTS-Provider")||"sawtakarabi.ai")+" · voice "+(name?name+" ":"")+h("X-TTS-Voice-Id")};
      }else{
        const detail=(await res.json().catch(()=>({}))).detail||res.status;
        ttsVoice="tts failed: "+detail;
        if(detail==="tts not configured") ttsOff=true;   // no key on the server: stop asking
      }
    }catch{}
    btn.disabled=false;
  }
  if(ttsUrls[key]){ if(cur.id===id){ new Audio(ttsUrls[key].url).play(); ttsInfo(ttsUrls[key].label); } return; }
  if(!("speechSynthesis" in window)){ ttsInfo("no voice available"); return; }
  const u=new SpeechSynthesisUtterance(cur.ar); const v=arVoice();
  if(v){u.voice=v;u.lang=v.lang;} else u.lang="ar-SA";
  u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u);
  ttsInfo("device voice"+(v?" "+v.name:"")+(ttsOff?" (tts not configured)":ttsVoice?" ("+ttsVoice+")":""));
};

fetch("/api/phrases").then(r=>r.json()).then(d=>{
  CATS=d.categories; PHRASES=d.phrases;
  for(const v of d.voices||[]) $("voiceId").add(new Option(v.name,v.id));
  const saved=store.get("ihki.voice",""); if((d.voices||[]).some(v=>v.id===saved)) $("voiceId").value=saved;
  if(!CATS.some(c=>c.id===cat)) cat=CATS[0].id;
  buildCats(); startCat();
}).catch(()=>{ $("prompt").textContent="השרת לא זמין."; });
</script>
</body>
</html>
