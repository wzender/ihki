<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ihki MCP test console</title><style>
:root{font-family:system-ui,sans-serif;color:#172116;background:#f3f6ef}*{box-sizing:border-box}body{margin:0;padding:clamp(1rem,3vw,2rem)}main{max-width:72rem;margin:auto}.grid{display:grid;grid-template-columns:minmax(18rem,1fr) minmax(20rem,1.2fr);gap:1rem}section{background:#fff;border:1px solid #d7dfd0;border-radius:16px;padding:1.2rem}label{display:block;font-weight:650;margin:.8rem 0 .3rem}input,select,textarea,button{font:inherit;border-radius:9px}input,select,textarea{width:100%;border:1px solid #aeb9a6;padding:.65rem}textarea{min-height:7rem;font-family:monospace}button{border:0;background:#45652d;color:white;padding:.7rem 1rem;font-weight:700;cursor:pointer}.secondary{background:#e8ede3;color:#26371b}.danger{background:#a22b2b}.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}.muted,small{color:#5d6858}.error{color:#9b1c1c}.warning{border:1px solid #d7a0a0;background:#fff5f5;padding:.8rem;border-radius:10px;margin-top:1rem}.check{display:flex;gap:.5rem;align-items:center;font-weight:500}.check input{width:auto}pre{margin:0;min-height:25rem;max-height:70vh;overflow:auto;background:#122010;color:#dcead8;border-radius:11px;padding:1rem;white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>ihki MCP test console</h1><p class="muted">Uses the real <code>/mcp/</code> endpoint and your current Supabase session. Access tokens are never displayed.</p><div class="grid"><section>
<p id="status">Checking sign-in…</p><div id="login" hidden><label>Email<input id="email" type="email" autocomplete="email"></label><div class="actions"><button id="google">Sign in with Google</button><button id="magic" class="secondary">Send magic link</button></div></div>
<div id="console" hidden><label>MCP action<select id="tool"></select></label><p id="description" class="muted"></p><div id="fields"></div><div id="publishWarning" class="warning" hidden><strong>This can change production data.</strong><label class="check"><input id="confirmPublish" type="checkbox">I reviewed the prepared preview and intend to publish it.</label></div><div class="actions"><button id="call">Call tool</button><button id="reload" class="secondary">Reload tools</button><button id="logout" class="secondary">Sign out</button></div></div>
</section><section><label>Protocol result</label><pre id="result">No request sent.</pre></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script><script>
const AUTH_URL=__SUPABASE_URL_JSON__,AUTH_KEY=__SUPABASE_KEY_JSON__,sb=AUTH_URL&&AUTH_KEY&&window.supabase?supabase.createClient(AUTH_URL,AUTH_KEY):null,$=id=>document.getElementById(id);let tools=[],nextId=1;
const fail=m=>{$("status").textContent=m;$("status").className="error"},session=async()=>sb?(await sb.auth.getSession()).data.session:null;
async function rpc(method,params={}){const s=await session();if(!s)throw Error("Sign in first.");const started=performance.now(),r=await fetch("/mcp/",{method:"POST",headers:{Authorization:`Bearer ${s.access_token}`,"Content-Type":"application/json",Accept:"application/json, text/event-stream"},body:JSON.stringify({jsonrpc:"2.0",id:nextId++,method,params})}),text=await r.text();let body;try{body=JSON.parse(text)}catch{const data=text.split(/\r?\n/).find(x=>x.startsWith("data:"));try{body=JSON.parse(data?.slice(5).trim()||"")}catch{body={raw:text}}}$("result").textContent=JSON.stringify({http_status:r.status,duration_ms:Math.round(performance.now()-started),response:body},null,2);if(!r.ok)throw Error(body?.detail||body?.error?.message||`HTTP ${r.status}`);return body}
function field(name,schema,required){const box=document.createElement("div"),label=document.createElement("label");label.textContent=name+(required?" *":"");box.append(label);let input;if(schema.enum){input=document.createElement("select");input.append(new Option(required?"Choose…":"(not set)",""),...schema.enum.map(x=>new Option(x,x)))}else if(schema.type==="boolean"){input=document.createElement("input");input.type="checkbox"}else if(["array","object"].includes(schema.type)){input=document.createElement("textarea");input.placeholder=schema.type==="array"?"[]":"{}"}else{input=document.createElement("input");input.type=["number","integer"].includes(schema.type)?"number":"text";if(schema.type==="integer")input.step="1"}input.dataset.name=name;input.dataset.type=schema.type||"string";input.dataset.required=required?"1":"";box.append(input);if(schema.description){const help=document.createElement("small");help.textContent=schema.description;box.append(help)}return box}
function render(){const t=tools.find(x=>x.name===$("tool").value);$("fields").replaceChildren();if(!t)return;$("description").textContent=t.description||"";const s=t.inputSchema||{},required=new Set(s.required||[]);for(const [name,p] of Object.entries(s.properties||{}))$("fields").append(field(name,p,required.has(name)));const publishing=t.name.startsWith("publish_");$("publishWarning").hidden=!publishing;$("confirmPublish").checked=false;$("call").className=publishing?"danger":""}
function args(){const out={};for(const input of $("fields").querySelectorAll("input,select,textarea")){if(input.type==="checkbox"){if(input.checked)out[input.dataset.name]=true;continue}const value=input.value.trim();if(!value){if(input.dataset.required)throw Error(`${input.dataset.name} is required.`);continue}if(["array","object"].includes(input.dataset.type)){try{out[input.dataset.name]=JSON.parse(value)}catch{throw Error(`${input.dataset.name} must be valid JSON.`)}}else if(["number","integer"].includes(input.dataset.type))out[input.dataset.name]=Number(value);else out[input.dataset.name]=value}return out}
async function load(){const listed=await rpc("tools/list");tools=listed.result?.tools||[];$("tool").replaceChildren(...tools.map(x=>new Option(x.name,x.name)));render();$("status").textContent=`Ready · ${tools.length} actions`;$("console").hidden=false}
async function begin(){if(!sb)return fail("Supabase sign-in is not configured.");if(!await session()){$("status").textContent="Sign in to use the console.";$("login").hidden=false;return}try{await rpc("initialize",{protocolVersion:"2025-03-26",capabilities:{},clientInfo:{name:"ihki-manual-console",version:"1"}});await load()}catch(e){fail(e.message)}}
$("tool").onchange=render;$("reload").onclick=()=>load().catch(e=>fail(e.message));$("call").onclick=async()=>{try{if($("tool").value.startsWith("publish_")&&!$("confirmPublish").checked)throw Error("Confirm the publish action first.");$("call").disabled=true;await rpc("tools/call",{name:$("tool").value,arguments:args()})}catch(e){fail(e.message)}finally{$("call").disabled=false}};$("google").onclick=()=>sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href,queryParams:{prompt:"select_account"}}});$("magic").onclick=async()=>{const email=$("email").value.trim();if(!email)return fail("Enter an email address.");const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});error?fail("Could not send the link."):$("status").textContent="Sign-in link sent."};$("logout").onclick=async()=>{await sb.auth.signOut({scope:"local"});location.reload()};begin();
</script></body></html>
