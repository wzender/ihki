<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 489 225" role="img" aria-label="מתמטיקה בכיף"><style>
.ink{fill:none;stroke:#242222;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-in-out var(--d) forwards}
.op{fill:none;stroke:#2F5597;stroke-width:7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out var(--d) forwards}
.dot{fill:#2F5597;opacity:0;animation:show .3s ease-out var(--d) forwards}
.curve{fill:none;stroke:#E8A33D;stroke-width:4;opacity:.85;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-in-out .55s forwards}
text{opacity:0;animation:show .5s ease-out var(--d) forwards;font-family:Assistant,"Secular One","Noto Sans Hebrew",Arial,sans-serif}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes show{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.ink,.op,.curve{animation:none;stroke-dashoffset:0}.dot,text{animation:none;opacity:1}}
</style>
<!-- the tile: a rounded square split into four, one operation in each -->
<path class="ink" pathLength="1" style="--d:0s" d="M362,42 H448 A22,22 0 0 1 470,64 V160 A22,22 0 0 1 448,182 H362 A22,22 0 0 1 340,160 V64 A22,22 0 0 1 362,42 Z"/>
<path class="ink" pathLength="1" style="--d:.35s" d="M405,52 V172"/>
<path class="ink" pathLength="1" style="--d:.45s" d="M350,112 H460"/>
<!-- a parabola swept across the tile -->
<path class="curve" pathLength="1" d="M330,30 Q405,250 480,30"/>
<path class="op" pathLength="1" style="--d:.7s" d="M437.5,63 V97 M420.5,80 H454.5"/>
<path class="op" pathLength="1" style="--d:.8s" d="M355.5,80 H389.5"/>
<path class="op" pathLength="1" style="--d:.9s" d="M425.5,133 L449.5,157 M449.5,133 L425.5,157"/>
<path class="op" pathLength="1" style="--d:1s" d="M355.5,145 H389.5"/>
<circle class="dot" style="--d:1.05s" cx="372.5" cy="132" r="4.5"/>
<circle class="dot" style="--d:1.05s" cx="372.5" cy="158" r="4.5"/>
<!-- the name -->
<text style="--d:1.3s" x="318" y="112" text-anchor="end" font-size="64" font-weight="700" fill="#242222">מתמטיקה</text>
<text style="--d:1.45s" x="318" y="156" text-anchor="end" font-size="38" font-weight="600" fill="#2F5597">בכיף</text>
<text style="--d:1.6s" x="318" y="188" text-anchor="end" font-size="19" fill="#5B665C">המורה הפרטי שלך למתמטיקה</text>
</svg>
