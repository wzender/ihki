<script>
const $=id=>document.getElementById(id);
const OS=new URLSearchParams(location.search).get("os")==="android"?"android":"ios";
document.body.classList.add(OS);
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const lerp=(a,b,x)=>a+(b-a)*x;
const win=(t,a,b,fade=.35)=>Math.min(a<=0?1:ease((t-a)/fade),ease((b-t)/fade));
const pop=x=>x<=0?0:x>=1?1:1+2.2*Math.pow(x-1,3)+1.2*Math.pow(x-1,2);   // in with a small overshoot
const UIK=609/393, SCREEN={w:609,h:1321,pad:16}, PHONE={w:641,h:1353,cx:220+641/2,cy:504+1353/2};
const OPEN_END=3.6, LOGO=6.8, LOGO_SPEED=1.2;

/* each OS: its captions, the screen's states, the taps (each with its ring before it) and the camera */
const CONF={
 ios:{ os:"iPhone · Safari", title:"מתקינים<br>באייפון",
  caps:[

 android:{ os:"Android · Chrome", title:"מתקינים<br>באנדרואיד",

const C=CONF;

// the home screen's apps: generic, drawn in the logo's colors (RTL: the first is top right)
const APPS=[["☀︎","#F2A33A","מזג אוויר"],["🕑","#1C1C1E","שעון"],["📷","#8E8E93","מצלמה"],["🖼","#fff","תמונות"],
            ["🗺","#58B368","מפות"],["📅","#fff","לוח שנה"],["✎","#F5C542","הערות"],["⚙︎","#6E6E73","הגדרות"],
            ["🧮","#2C2C2E","מחשבון"],["🎵","#E5484D","מוזיקה"]];
const COLX=[337,241,145,49], ROWY=[66,166,266];   // centers of the grid (RTL), tops of its rows
const DOCK=[["📞","#34C759"],["💬","#34C759"],["🧭","#1E8CF0"],["✉︎","#1E8CF0"]];

function build(){
  $("ui").innerHTML=`<div class="status"><span>9:41</span><span class="ic"><span class="sig"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:12px"></i></span><span>5G</span><span class="bat"></span></span></div>`+
    $("t-"+OS).innerHTML+$("t-home").innerHTML+`<div id="ring"></div><div id="tap"></div>`;
  const home=$("home");
  APPS.forEach(([g,c,n],i)=>{ const a=document.createElement("div"); a.className="app"; a.style.left=COLX[i%4]-40+"px"; a.style.top=ROWY[Math.floor(i/4)]+"px";
    a.innerHTML=`<i style="background:${c}">${g}</i>${n}`; home.append(a); });
  const m=document.createElement("div"); m.className="app"; m.id="mine"; m.style.left=COLX[2]-40+"px"; m.style.top=ROWY[2]+"px";
  m.innerHTML=`<i></i>אהלא וסהלא<span class="new">חדש</span>`; home.append(m);
  if(OS==="ios") DOCK.forEach(([g,c],i)=>{ const a=document.createElement("div"); a.className="app"; a.style.left=COLX[i]-40+"px"; a.style.top="772px";
    a.innerHTML=`<i style="background:${c}">${g}</i>`; home.append(a); });
  else ["📞","💬","🌐","📷"].forEach((g,i)=>{ const a=document.createElement("div"); a.className="app"; a.style.left=COLX[i]-40+"px"; a.style.top="690px";
    a.innerHTML=`<i style="background:#fff">${g}</i>`; home.append(a); });
  // the status bar's color: dark on the browser, light on the wallpaper (set in seek)
  for(const [id,a,b,html] of C.caps){ const d=document.createElement("div"); d.className="cap"; d.id=id; d.innerHTML=html; $("caps").append(d); }
  $("tip").innerHTML=C.tip; $("annOs").textContent=C.os; $("annH").innerHTML=C.title;
  for(let i=1;i<=16;i++){ const s=document.createElement("div"); s.className="slab";
    s.style.transform=`translateZ(${-i}px)`; s.style.background=i<3||i>14?"#9AA0A8":"#3A3C44"; $("slabs").append(s); }
  for(const [top,h,side] of [[300,110,"left"],[460,170,"left"],[380,200,"right"]]){
    const b=document.createElement("div"); b.className="btn-side"; b.style.top=top+"px"; b.style.height=h+"px";
    b.style[side]="-6px"; b.style.transform="translateZ(-8px)"; $("phone").append(b); }
}

let KEYS=[], LOGO_ANIMS=[];
const onPhone=(x,y)=>({x:SCREEN.pad+x*UIK-PHONE.w/2, y:SCREEN.pad+y*UIK-PHONE.h/2});   // a point of the ui, from the phone's center
function focus(x,y,k,fx=540,fy=1180){ const p=onPhone(x,y); return {tx:fx-PHONE.cx-k*p.x, ty:fy-PHONE.cy-k*p.y, k, rx:2, ry:-3, rz:0}; }

async function setup(){
  build();
  await document.fonts.ready;
  // where each thing to tap is on the screen, in the ui's own pixels (measured before anything moves)
  const u=$("ui").getBoundingClientRect(); C.boxes={};
  for(const [k,sel] of Object.entries(C.sel)){ const r=document.querySelector(sel).getBoundingClientRect();
    C.boxes[k]=[(r.left-u.left)/UIK,(r.top-u.top)/UIK,r.width/UIK,r.height/UIK]; }
  const svg=await (await fetch("logo-intro.svg")).text();
  $("logoSvg").innerHTML=svg;
  LOGO_ANIMS=$("logoSvg").getAnimations({subtree:true}); LOGO_ANIMS.forEach(a=>a.pause());
  $("openSvg").innerHTML=svg.replace(/id="([\w-]+)"/g,'id="o_$1"').replace(/href="#([\w-]+)"/g,'href="#o_$1"').replace(/url\(#([\w-]+)\)/g,"url(#o_$1)");
  $("openSvg").getAnimations({subtree:true}).forEach(a=>{ a.pause(); a.currentTime=60000; });
  await Promise.all(["app.png","icon.png","icon-maskable.png"].map(s=>{ const im=new Image(); im.src=s; return im.decode().catch(()=>{}); }));
  const rest={tx:0,ty:0,k:1,rx:4,ry:-14,rz:0}, away={tx:0,ty:1500,k:.9,rx:20,ry:-30,rz:-6};
  const calm={tx:0,ty:0,k:1,rx:3,ry:-6,rz:0};
  KEYS=[[0,away],[OPEN_END-.4,away],[OPEN_END+.6,rest],[4.6,calm]];
  for(const [t,box,k] of C.cam){
    if(box){ const b=C.boxes[box]; KEYS.push([t,focus(b[0]+b[2]/2,b[1]+b[3]/2,k)]); }
    else KEYS.push([t,calm]); }
  KEYS.push([C.tipAt[0]-.2,calm],[C.tipAt[0]+.5,{tx:0,ty:420,k:.78,rx:8,ry:-16,rz:0}],[C.tipAt[1]-.3,{tx:0,ty:430,k:.78,rx:8,ry:-10,rz:0}],[C.tipAt[1]+.5,away]);
  KEYS.sort((a,b)=>a[0]-b[0]);
}
const duration=()=>C.end+LOGO;
function stateAt(t){
  let i=KEYS.findIndex(k=>k[0]>t); if(i<0) return KEYS[KEYS.length-1][1]; if(i===0) return KEYS[0][1];
  const [t0,a]=KEYS[i-1], [t1,b]=KEYS[i], x=ease((t-t0)/(t1-t0)), s={};
  for(const k in a) s[k]=lerp(a[k],b[k],x); return s;
}
// a layer's presence (0..1) at t: in with its state, out when the next state drops it
function presence(id,t){
  let v=0;
  for(let i=0;i<C.states.length;i++){ const [a,on]=C.states[i], b=i+1<C.states.length?C.states[i+1][0]:1e9;
    if(!on.includes(id)) continue;
    const prev=i>0&&C.states[i-1][1].includes(id), next=i+1<C.states.length&&C.states[i+1][1].includes(id);
    const x=Math.min(prev?1:ease((t-a)/.35), next?1:1-ease((t-b)/.3));
    if(t>=a-0.001&&t<b+.3) v=Math.max(v,x); }
  return v;
}
const SLIDE={shareL:"up",addL:"up",menu:"pop",dlgL:"pop",home:"fade",app:"open",browser:"fade"};

async function seek(t){
  const p=stateAt(t);
  $("phone").style.transform=`translate3d(${p.tx}px,${p.ty}px,0) rotateX(${p.rx}deg) rotateY(${p.ry}deg) rotateZ(${p.rz}deg) scale(${p.k})`;
  $("shadow").style.transform=`translate(${p.tx}px,${Math.min(p.ty,300)*.2}px) scale(${p.k*(1-Math.abs(p.ry)/90)},1)`;
  $("shadow").style.opacity=Math.max(0,1-Math.max(0,p.ty)/600);
  $("gloss").style.backgroundPosition=`${p.ry*4}px 0`;
  // the screen's layers
  for(const id of ["browser","menu","shareL","addL","dlgL","home","app"]){ const el=$(id); if(!el) continue;
    const v=presence(id,t), kind=SLIDE[id]; el.style.visibility=v>0?"visible":"hidden";
    if(kind==="up"){ el.style.opacity=1; el.querySelector(".scrim").style.opacity=v; el.lastElementChild.style.transform=`translateY(${(1-v)*560}px)`; }
    else if(kind==="pop"){ el.style.opacity=v; const c=el.querySelector(".menu,#dlg"); c.style.transformOrigin=id==="menu"?(OS==="ios"?"0% 100%":"0% 0%"):"50% 50%"; c.style.transform=`scale(${lerp(.85,1,v)})`; }
    else if(kind==="open"){ const m=C.boxes.mine, ox=m[0]+m[2]/2, oy=m[1]+m[3]/2; el.style.transformOrigin=`${ox}px ${oy}px`;
      el.style.transform=`scale(${lerp(.16,1,v)})`; el.style.opacity=Math.min(1,v*3); el.style.borderRadius=lerp(60,0,v)+"px"; }
    else el.style.opacity=v; }
  // the status bar: light over the wallpaper
  const onHome=presence("home",t)*(1-presence("app",t));
  document.querySelector(".status").style.color=onHome>.5?"#fff":"#111";
  // our icon arrives on the home screen
  const mi=pop((t-C.mineAt)/.6); $("mine").style.transform=`scale(${mi})`; $("mine").style.opacity=Math.min(1,mi*2);
  $("mine").querySelector(".new").style.opacity=ease((t-C.mineAt-.5)/.3);
  // the ring before each tap, then the tap's ripple
  let ro=0, rb=null, to=0, tb=null, tx=0;
  for(const [a,b,box] of C.taps){ const o=win(t,a,b+.05,.25); if(o>ro){ ro=o; rb=C.boxes[box]; }
    if(t>=b&&t<b+.5){ to=1-ease((t-b)/.5); tb=C.boxes[box]; tx=ease((t-b)/.5); } }
  if(rb){ const pad=5; Object.assign($("ring").style,{left:rb[0]-pad+"px",top:rb[1]-pad+"px",width:rb[2]+2*pad+"px",height:rb[3]+2*pad+"px",opacity:ro,
    transform:`scale(${1+.05*Math.sin(t*7)})`}); } else $("ring").style.opacity=0;
  if(tb){ Object.assign($("tap").style,{left:tb[0]+tb[2]/2+"px",top:tb[1]+tb[3]/2+"px",opacity:to,transform:`scale(${lerp(.6,1.8,tx)})`}); } else $("tap").style.opacity=0;
  // the opening: the logo, then what this video shows
  const op=Math.min(ease(t/.5),1-ease((t-(OPEN_END-.4))/.5)), up=ease((t-.8)/.8);
  $("open").style.opacity=op; $("open").style.visibility=op>0?"visible":"hidden";
  $("open").style.transform=`translateY(${-420*up}px) scale(${lerp(.94,1,ease(t/1.0))*lerp(1,.82,up)})`;
  const rise=ease((t-1.0)/.8), an=Math.min(ease((t-1.0)/.4),1-ease((t-(OPEN_END-.4))/.5));
  $("announce").style.opacity=an; $("announce").style.visibility=an>0?"visible":"hidden";
  $("announce").style.transform=`translateY(${(1-rise)*820}px)`;
  $("band").style.opacity=ease((t-OPEN_END+.4)/.4);
  for(const [id,a,b] of C.caps){ const o=win(t,a,b); $(id).style.opacity=o; $(id).style.transform=`translateY(${(1-o)*30}px)`; }
  const tp=win(t,C.tipAt[0],C.tipAt[1],.45); $("tip").style.opacity=tp; $("tip").style.transform=`translateY(${(1-tp)*40}px) scale(${lerp(.94,1,tp)})`;
  // the closing logo, its whole animation
  const L=C.end;
  $("logo").style.opacity=ease((t-L+.2)/.4); $("logo").style.visibility=t>L-.2?"visible":"hidden";
  LOGO_ANIMS.forEach(a=>{ a.currentTime=Math.max(0,t-L)*1000*LOGO_SPEED; });
  const cta=ease((t-L-5.0)/.5); $("logo").querySelector(".cta").style.opacity=cta;
  $("logo").querySelector(".cta").style.transform=`translateY(${(1-cta)*24}px)`;
  $("stage").style.opacity=1-ease((t-L+.3)/.4);
}
